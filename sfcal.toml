# sf-cal configuration. Every feed URL is derived from a bucket key here:
#   https://raw.githubusercontent.com/nredd/sf-cal/feeds/<bucket>.ics
# Renaming or removing a bucket breaks every subscription to it. Don't.

near_days = 14          # every run refreshes yesterday .. today+14d
full_days = 60          # a full run reaches today+60d
full_refresh_hours = 20 # a run is full when the last full run is older than this
prune_days = 7          # ended events stay published this long

# ---------------------------------------------------------------------------
# Buckets, in display order. Each one is a separately subscribable feed.

[buckets.fleet-week]
name = "Fleet Week"
description = "SF Fleet Week: official concerts, ship tours, air shows, plus side events"

[buckets.music]
name = "Music"
description = "Concerts and live music"

[buckets.comedy]
name = "Comedy"
description = "Stand-up, improv and comedy shows"

[buckets.stage]
name = "Stage"
description = "Theatre, dance and performing arts"

[buckets.film]
name = "Film"
description = "Screenings and film events"

[buckets.nightlife]
name = "Nightlife"
description = "DJ sets, parties and LGBTQ nights"

[buckets.food-drink]
name = "Food & Drink"
description = "Tastings, food events and pop-ups"

[buckets.outdoors]
name = "Outdoors"
description = "Outdoor recreation and sports"

[buckets.arts-community]
name = "Arts & Community"
description = "Arts, family, lectures, festivals, markets and everything else"

[buckets.city-hall-lights]
name = "City Hall Lights"
description = "What color City Hall is lit tonight, and why"

[buckets.street-events]
name = "Street Events"
description = "Permitted street closures: block parties, street fairs, night markets, Sunday Streets"

# ---------------------------------------------------------------------------
# Keyword routing. A timed event matching a rule MOVES to the rule's bucket.
# An all-day event matching a rule is dropped (umbrella listings).

[[bucket_rules]]
bucket = "fleet-week"
pattern = '\b(fleet week|blue angels|parade of ships)\b'

# ---------------------------------------------------------------------------
# Sources. `priority` picks the winner when the same event (normalized title +
# date) shows up on more than one source.

[sources.fleetweeksf]
adapter = "fleetweeksf"
label = "SF Fleet Week (fleetweeksf.org)"
priority = 100
sf_only = false
default_duration_minutes = 60

[sources.fleetweeksf.options.venue_aliases]
# The calendar names the festival, not the place; other sources name the place.
"Fleet Fest" = "Fleet Fest (SkyStar Wheel, Fisherman's Wharf)"

# Lighting nights are all-day and often name Fleet Week or a parade, so they
# opt out of keyword routing, which would drop them as umbrellas.
[sources.sf-city-hall-lights]
adapter = "cityhall"
label = "SF.gov City Hall lighting"
priority = 90
apply_bucket_rules = false

[sources.sf-city-hall-lights.options]
url = "https://www.sf.gov/location--san-francisco-city-hall"
bucket = "city-hall-lights"

# SFMTA special-event street closure permits. Lowest priority: any real
# listing of the same event wins, and Fleet Week block parties still route to
# `fleet-week` through the keyword rule.
[sources.sf-street-events]
adapter = "streetclosures"
label = "DataSF street closures"
priority = 20

[sources.sf-street-events.options]
url = "https://data.sf.gov/resource/8x25-yybr.json"
bucket = "street-events"
skip_pattern = '\bcorporate\b'

[sources.dothebay]
adapter = "dostuff"
label = "DoTheBay"
priority = 80

[sources.dothebay.options]
base_url = "https://dothebay.com"
drop_categories = ["Digital Events"]
default_bucket = "arts-community"
# Music is ~40 SF shows a day; keep the popular ones and anything free.
popularity_gates = { "Music" = 50 }

[sources.dothebay.options.categories]
"Music" = "music"
"Comedy" = "comedy"
"Theatre & Performing Arts" = "stage"
"Dance" = "stage"
"Film" = "film"
"DJ/Parties" = "nightlife"
"LGBTQ" = "nightlife"
"Drag" = "nightlife"
"Food & Drink" = "food-drink"
"Outdoor & Recreation" = "outdoors"
"Sports" = "outdoors"
"The Arts" = "arts-community"
"Arts & Family" = "arts-community"
"Experiences" = "arts-community"
"Lecture/Education" = "arts-community"
"Activism" = "arts-community"
"Literature" = "arts-community"
"Variety" = "arts-community"
"Festival" = "arts-community"
"Shopping" = "arts-community"
"Holiday Event" = "arts-community"

[sources.funcheap]
adapter = "jsonld"
label = "Funcheap SF"
priority = 60

[sources.funcheap.options]
base_url = "https://sf.funcheap.com"
lookback_days = 45
concurrency = 4
default_bucket = "arts-community"
# Not SF, or not in person: never fetched.
skip_categories = ["virtual", "east-bay", "south-bay", "north-bay", "peninsula"]

# First slug in THIS order that a post carries wins; posts carry several.
[sources.funcheap.options.categories]
"comedy-event-types-event" = "comedy"
"movies" = "film"
"outdoor-movie-night" = "film"
"free-movie-screening" = "film"
"theater-performance" = "stage"
"dance" = "stage"
"live-music-event" = "music"
"club-dj" = "nightlife"
"lgbtq" = "nightlife"
"eating-drinking" = "food-drink"
"cheap-drinks-eating-drinking" = "food-drink"
"free-food" = "food-drink"
"sf-beer-week" = "food-drink"
"outdoors" = "outdoors"
"sports-fitness" = "outdoors"
"nature" = "outdoors"
"bike-it" = "outdoors"
"yoga" = "outdoors"
"art-museums" = "arts-community"
"lectures-workshops" = "arts-community"
"literature" = "arts-community"
"kids-families" = "arts-community"
"fairs-festivals" = "arts-community"
"community" = "arts-community"
"history" = "arts-community"
"geek-event" = "arts-community"
"fun-games" = "arts-community"
"block-party" = "arts-community"
"walks-tours-event-types-event" = "arts-community"

# CalDiscovery aggregates ~80 venue and org calendars and republishes them as
# ICS under ODbL 1.0, which requires the attribution below on every event.
[sources.caldiscovery-festival]
adapter = "ics"
label = "CalDiscovery"
priority = 40

[sources.caldiscovery-festival.options]
url = "https://caldiscovery.com/san-francisco-ca/festival.ics"
bucket = "arts-community"
attribution = "Contains information from CalDiscovery (caldiscovery.com), ODbL 1.0"

[sources.caldiscovery-comedy]
adapter = "ics"
label = "CalDiscovery"
priority = 40

[sources.caldiscovery-comedy.options]
url = "https://caldiscovery.com/san-francisco-ca/comedy.ics"
bucket = "comedy"
attribution = "Contains information from CalDiscovery (caldiscovery.com), ODbL 1.0"

# SF Civic Center CBD (The Events Calendar export). Most entries are
# season-long umbrellas (a farmers market spanning years); keep the one-offs.
[sources.sfciviccenter]
adapter = "ics"
label = "SF Civic Center"
priority = 50

[sources.sfciviccenter.options]
url = "https://sfciviccenter.org/events/?ical=1"
bucket = "arts-community"
max_span_days = 3

# Yerba Buena Gardens Festival: free outdoor music and dance, May-Nov.
[sources.ybgfestival]
adapter = "ics"
label = "Yerba Buena Gardens Festival"
priority = 50

[sources.ybgfestival.options]
url = "https://ybgfestival.org/events/?ical=1"
bucket = "music"

# SF Rec & Park CivicPlus calendars, one feed per catID. The full list is at
# https://sfrecpark.org/iCalendar.aspx
[sources.sfrecpark-main]
adapter = "ics"
label = "SF Rec & Park"
priority = 45

[sources.sfrecpark-main.options]
url = "https://sfrecpark.org/common/modules/iCalendar/iCalendar.aspx?catID=14&feed=calendar"
bucket = "outdoors"

[sources.sfrecpark-bandshell]
adapter = "ics"
label = "SF Rec & Park"
priority = 45

[sources.sfrecpark-bandshell.options]
url = "https://sfrecpark.org/common/modules/iCalendar/iCalendar.aspx?catID=35&feed=calendar"
bucket = "music"

[sources.sfrecpark-civic-center]
adapter = "ics"
label = "SF Rec & Park"
priority = 45

[sources.sfrecpark-civic-center.options]
# Mostly free fitness classes on the plazas, hence outdoors.
url = "https://sfrecpark.org/common/modules/iCalendar/iCalendar.aspx?catID=40&feed=calendar"
bucket = "outdoors"
